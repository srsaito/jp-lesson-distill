[project]
name = "jp-lesson-distill"
version = "0.1.0"
description = "Distill Japanese lesson recordings into learning moments for flashcard generation"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0",
    "pydantic>=2.7",
    "imageio-ffmpeg>=0.5",
]

[project.scripts]
distill = "jp_lesson_distill.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jp_lesson_distill"]
